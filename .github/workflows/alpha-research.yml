name: Alpha Research Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 6'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyarrow scikit-learn
      - name: Build point-in-time alpha dataset
        run: python scripts/build_alpha_dataset.py --output reports/alpha_dataset.parquet
      - name: Run purged walk-forward benchmark
        run: python scripts/run_walk_forward_alpha.py --input reports/alpha_dataset.parquet --output reports/alpha_oos_predictions.csv
      - name: Probability uncertainty and calibration
        run: python scripts/run_uncertainty.py --input reports/alpha_oos_predictions.csv --output reports/alpha_uncertainty.csv
      - name: Regime-conditioned calibration
        run: python scripts/run_regime_calibration.py --input reports/alpha_oos_predictions.csv --output reports/regime_calibration.csv
      - name: Cross-sectional ranking
        run: python scripts/run_cross_sectional_rank.py --input reports/alpha_oos_predictions.csv --output reports/cross_sectional_rank.csv --top-k 10
      - name: Compare economic performance
        run: python -m src.strategy_compare --input reports/alpha_oos_predictions.csv --output reports/strategy_comparison.csv
      - name: Evaluate structural plus alpha ensemble
        run: python scripts/evaluate_ensemble.py --input reports/alpha_oos_predictions.csv --output reports/ensemble_oos_comparison.csv
      - name: Portfolio risk stress
        run: python scripts/run_portfolio_risk.py --input reports/alpha_oos_predictions.csv --output reports/portfolio_risk.csv
      - name: Parameter sensitivity analysis
        run: python scripts/run_sensitivity.py --input reports/alpha_oos_predictions.csv --output reports/parameter_sensitivity.csv
      - name: Robustness summary
        run: python scripts/run_robustness.py --input reports/parameter_sensitivity.csv --output reports/robustness_summary.csv
      - name: Adversarial execution stress
        run: python scripts/run_adversarial_stress.py --input reports/alpha_oos_predictions.csv --output reports/adversarial_stress.csv
      - name: Walk-forward meta-label
        run: python scripts/run_meta_label.py --input reports/alpha_oos_predictions.csv --output reports/meta_label_oos.csv
      - name: Commit research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/alpha_dataset.parquet reports/alpha_oos_predictions.csv reports/alpha_oos_summary.csv reports/alpha_uncertainty.csv reports/alpha_calibration_bins.csv reports/regime_calibration.csv reports/regime_calibration_gate.csv reports/cross_sectional_rank.csv reports/strategy_comparison.csv reports/ensemble_oos_comparison.csv reports/ensemble_promotion_gate.csv reports/portfolio_risk.csv reports/parameter_sensitivity.csv reports/parameter_plateau.csv reports/robustness_summary.csv reports/adversarial_stress.csv reports/adversarial_summary.csv reports/meta_label_oos.csv
          git diff --cached --quiet || git commit -m 'research: add cross sectional opportunity ranking'
          git push
