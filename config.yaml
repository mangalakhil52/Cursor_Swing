# Indian weekly swing scanner — ADVANCED QUANT MODE
market:
  exchange_suffix: ".NS"
  benchmark: "^NSEI"

universe:
  list_file: data/nse_equity.csv
  series: [EQ]

derivatives:
  shorts_require_fno: true
  fno_universe_file: data/fno_universe.csv

filters:
  min_price: 30
  max_price: 100000
  min_avg_volume: 150000
  min_dollar_volume_cr: 10

risk:
  capital: 100000
  risk_per_trade_pct: 1.0
  min_risk_reward: 1.7
  max_position_pct: 25

swing:
  hold_horizon: "5-10 trading days"
  atr_stop_mult: 1.2
  atr_target_mult: 2.4
  stop_buffer_atr: 0.20
  min_stop_pct: 1.5
  max_stop_pct: 5.0
  max_target_pct: 12.0
  picks: 2

# Persistent market history. Cold start caches 365 calendar days; subsequent
# scans refresh only the latest 10 calendar days to capture corrections.
data_cache:
  history_days: 365
  refresh_days: 10

intelligence:
  min_atr_pct: 1.2
  min_rs_20d: 2.0
  allow_conviction_c: false

video_methodology:
  enabled: true
  reject_grade_b: true
  min_fair_value_distance_atr: 0.8

advanced:
  enabled: true
  hard_reject: true
  min_score: 68
  min_edge_probability: 0.60
  require_normal_or_expanding_volatility: true
  min_efficiency_ratio: 0.30
  max_entropy: 0.92
  min_persistence: 0.40
  max_ema_extension_pct: 12.0

scoring:
  min_score: 65
  weights:
    trend: 18
    momentum: 12
    volume: 12
    volatility: 10
    market_alignment: 12
    energy: 16
    relative_strength: 20

indicators:
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  atr_period: 14
  volume_sma_period: 20

ai:
  enabled: true
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.1
  timeout_sec: 90
  shortlist_size: 15
  shortlist_min_score: 65
  max_picks: 2
  require_ai_approval: true
